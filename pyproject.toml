[project]
name = "questions"
version = "0.1.0"
description = ""
authors = [
    {name = "T1rin",email = "t1rin@mail.ru"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)"
]

[dependency-groups]
dev = [
    "mypy (>=2.3.1,<3.0.0)"
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "pydantic.*"
ignore_missing_imports = true


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"